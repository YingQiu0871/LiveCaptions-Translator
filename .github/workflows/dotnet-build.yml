name: CI/CD Pipeline

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
    paths:
      - "src/**"
      - "desktop/**"
      - "Properties/**"
      - ".github/workflows/**"
      - "installer/**"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release from this build"
        type: boolean
        default: false

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Check code formatting
        run: dotnet format ./LiveCaptionsTranslator.csproj --verify-no-changes --verbosity diagnostic

      - name: Build
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o ./publish/x64/selfcontained
          del ./publish/x64/selfcontained/*.pdb 2>nul || echo "No pdb found in x64 selfcontained"

          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./publish/x64/framework
          del ./publish/x64/framework/*.pdb 2>nul || echo "No pdb found in x64 framework"

          dotnet publish -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o ./publish/arm64/selfcontained
          del ./publish/arm64/selfcontained/*.pdb 2>nul || echo "No pdb found in arm64 selfcontained"

          dotnet publish -c Release -r win-arm64 --self-contained false -p:PublishSingleFile=true -o ./publish/arm64/framework
          del ./publish/arm64/framework/*.pdb 2>nul || echo "No pdb found in arm64 framework"

      - name: Build MSI installers
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path ./.wix
          ./.wix/wix extension add -g WixToolset.UI.wixext/5.0.2
          $version = "1.7.${{ github.run_number }}"
          foreach ($arch in "x64", "arm64") {
            ./.wix/wix build installer/LiveCaptionsTranslator.wxs -arch $arch -culture zh-CN `
              -ext WixToolset.UI.wixext `
              -d Version=$version `
              -d SourceExe=publish/$arch/selfcontained/LiveCaptionsTranslator.exe `
              -d IconFile=src/LiveCaptions-Translator.ico `
              -d LicenseRtf=installer/License.rtf `
              -o publish/installer/LiveCaptionsTranslator-win-$arch-setup.msi
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item publish/installer/*.wixpdb -ErrorAction SilentlyContinue

      - name: Run Tests
        run: dotnet test --verbosity normal

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptionsTranslator
          path: ./publish

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Restore Dependencies
        run: dotnet restore desktop/LiveCaptionsTranslator.Desktop.csproj

      - name: Check code formatting
        run: dotnet format desktop/LiveCaptionsTranslator.Desktop.csproj --verify-no-changes --verbosity diagnostic

      - name: Build
        run: >
          dotnet publish desktop/LiveCaptionsTranslator.Desktop.csproj -c Release -r linux-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/linux-x64

      - name: Self-test
        run: ./publish/linux-x64/LiveCaptionsTranslator --selftest

      - name: Package
        run: |
          mkdir -p dist/LiveCaptionsTranslator
          cp publish/linux-x64/LiveCaptionsTranslator dist/LiveCaptionsTranslator/
          cp desktop/assets/icon.png dist/LiveCaptionsTranslator/icon.png
          cp "desktop/linux/课堂同传助手.desktop" desktop/linux/install.sh dist/LiveCaptionsTranslator/
          chmod +x dist/LiveCaptionsTranslator/LiveCaptionsTranslator dist/LiveCaptionsTranslator/install.sh
          mkdir -p out
          tar -czf out/LiveCaptionsTranslator-linux-x64.tar.gz -C dist LiveCaptionsTranslator

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptionsTranslator-linux
          path: ./out

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Build audio capture helper
        run: |
          mkdir -p build/helper
          swiftc -O -swift-version 5 -target arm64-apple-macos13 desktop/macos/lct-audio.swift -o build/helper/lct-audio-arm64
          swiftc -O -swift-version 5 -target x86_64-apple-macos13 desktop/macos/lct-audio.swift -o build/helper/lct-audio-x64

      - name: Make icon
        run: |
          iconset=build/AppIcon.iconset
          mkdir -p "$iconset"
          src=desktop/assets/icon.png
          for size in 16 32 128 256 512; do
            sips -z $size $size "$src" --out "$iconset/icon_${size}x${size}.png" >/dev/null
          done
          cp "$iconset/icon_32x32.png" "$iconset/icon_16x16@2x.png"
          cp "$iconset/icon_256x256.png" "$iconset/icon_128x128@2x.png"
          cp "$iconset/icon_512x512.png" "$iconset/icon_256x256@2x.png"
          iconutil -c icns "$iconset" -o build/AppIcon.icns

      - name: Build apps and disk images
        run: |
          version="1.7.${{ github.run_number }}"
          mkdir -p out
          for arch in arm64 x64; do
            dotnet publish desktop/LiveCaptionsTranslator.Desktop.csproj -c Release -r osx-$arch \
              --self-contained true -o publish/osx-$arch

            app="build/$arch/课堂同传助手.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp -R publish/osx-$arch/. "$app/Contents/MacOS/"
            rm -f "$app/Contents/MacOS/"*.pdb
            cp build/helper/lct-audio-$arch "$app/Contents/MacOS/lct-audio"
            chmod +x "$app/Contents/MacOS/LiveCaptionsTranslator" "$app/Contents/MacOS/lct-audio"
            cp build/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
            sed "s/__VERSION__/$version/g" desktop/macos/Info.plist > "$app/Contents/Info.plist"
            codesign --force --deep -s - "$app"

            # The self-test needs a binary of this machine's architecture.
            if [ "$arch" = "$(uname -m | sed 's/x86_64/x64/')" ]; then
              "$app/Contents/MacOS/LiveCaptionsTranslator" --selftest
            fi

            staging="build/$arch/dmg"
            mkdir -p "$staging"
            cp -R "$app" "$staging/"
            ln -s /Applications "$staging/Applications"
            # hdiutil sometimes fails with "Resource busy" on a CI runner: try again.
            for attempt in 1 2 3; do
              hdiutil create -ov -srcfolder "$staging" -volname 课堂同传助手 -format UDZO \
                "out/LiveCaptionsTranslator-macos-$arch.dmg" && break
              if [ "$attempt" = 3 ]; then
                exit 1
              fi
              sleep 5
            done
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptionsTranslator-macos
          path: ./out

  release:
    name: Create GitHub Release
    needs: [build, build-linux, build-macos]
    # Same runner type as the build: hosted Ubuntu runners were repeatedly not available here.
    runs-on: windows-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release)
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: LiveCaptionsTranslator
          path: ./release

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: LiveCaptionsTranslator-linux
          path: ./release/desktop

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: LiveCaptionsTranslator-macos
          path: ./release/desktop

      - name: Create ZIP Files and rename EXE
        shell: bash
        run: |
          cd release
          mv x64/framework/LiveCaptionsTranslator.exe LiveCaptionsTranslator-win-x64.exe
          mv arm64/framework/LiveCaptionsTranslator.exe LiveCaptionsTranslator-win-arm64.exe
          mv x64/selfcontained/LiveCaptionsTranslator.exe LiveCaptionsTranslator-win-x64-withruntime.exe
          mv arm64/selfcontained/LiveCaptionsTranslator.exe LiveCaptionsTranslator-win-arm64-withruntime.exe
          mv installer/*.msi .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # A manual run creates its own tag, e.g. v1.7-lecture.12.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.7-lecture.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          body: |
            课堂同传助手：实时字幕 + 中文翻译 + 分节小结 + 耳机播报。

            - 推荐下载安装包 `LiveCaptionsTranslator-win-x64-setup.msi`：双击安装，可以自选安装位置，装好后开始菜单和桌面都有快捷方式，卸载在“设置 > 应用”里。
            - 免安装版：`LiveCaptionsTranslator-win-x64-withruntime.exe`（自带运行库，直接运行）；`LiveCaptionsTranslator-win-x64.exe` 体积小，需要先装 .NET 8 桌面运行时。
            - ARM 电脑选 arm64 版本。
            - Linux：下载 `LiveCaptionsTranslator-linux-x64.tar.gz`，解压后运行 `install.sh`。
            - macOS（13 及以上）：下载对应芯片的 `.dmg`（Apple 芯片选 arm64，Intel 选 x64），把应用拖进“应用程序”。
            - macOS 首次打开：应用没有苹果的公证签名，macOS 15 及以上不能再靠右键“打开”放行。请先双击打开一次（会被拦下），再到“系统设置 > 隐私与安全性”，点“仍要打开”；也可以在终端运行 `xattr -dr com.apple.quarantine /Applications/课堂同传助手.app`。
            - macOS 每次更新后，麦克风、屏幕录制权限可能需要重新授权。

            使用说明见仓库首页 README。
          files: |
            release/LiveCaptionsTranslator-win-x64-setup.msi
            release/LiveCaptionsTranslator-win-arm64-setup.msi
            release/LiveCaptionsTranslator-win-x64.exe
            release/LiveCaptionsTranslator-win-x64-withruntime.exe
            release/LiveCaptionsTranslator-win-arm64.exe
            release/LiveCaptionsTranslator-win-arm64-withruntime.exe
            release/desktop/LiveCaptionsTranslator-linux-x64.tar.gz
            release/desktop/LiveCaptionsTranslator-macos-arm64.dmg
            release/desktop/LiveCaptionsTranslator-macos-x64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
