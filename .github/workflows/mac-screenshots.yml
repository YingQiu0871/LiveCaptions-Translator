name: mac-screenshots
on:
  pull_request:
    paths: ['.github/workflows/mac-screenshots.yml', '.github/screenshots/**']
concurrency:
  group: mac-shots
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"
      - name: Build app
        timeout-minutes: 15
        run: |
          mkdir -p /tmp/app /tmp/shots
          dotnet publish desktop/LiveCaptionsTranslator.Desktop.csproj -c Release -r osx-arm64 \
            --self-contained true -o publish/osx-arm64
          app="/tmp/app/课堂同传助手.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R publish/osx-arm64/. "$app/Contents/MacOS/"
          sed "s/__VERSION__/1.7.0/g" desktop/macos/Info.plist > "$app/Contents/Info.plist"
          chmod +x "$app/Contents/MacOS/LiveCaptionsTranslator"
          codesign --force --deep -s - "$app"
      - name: Screenshots
        timeout-minutes: 6
        run: |
          set +e
          brew install cliclick
          python3 .github/screenshots/seed.py /tmp/lctdata
          export LCT_DATA_DIR=/tmp/lctdata
          system_profiler SPDisplaysDataType | grep -i resolution | tee /tmp/shots/res.txt
          nohup "/tmp/app/课堂同传助手.app/Contents/MacOS/LiveCaptionsTranslator" > /tmp/shots/app.log 2>&1 &
          sleep 12
          screencapture -x /tmp/shots/00-full.png
          osascript -e 'tell application "System Events" to tell (first process whose unix id is '$!') to get {position, size} of window 1' | tee /tmp/shots/win.txt
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' | tee -a /tmp/shots/win.txt
          cat /tmp/shots/app.log | tail -20
          ls -la /tmp/lctdata
          # window at (100,100) pt incl. title bar; client origin ~ (100,128)
          OX=${OX:-100}; OY=${OY:-128}
          click() { cliclick c:$((OX+$1)),$((OY+$2)); sleep 2; }
          click 44 115; screencapture -x /tmp/shots/01-settings.png
          click 44 157; screencapture -x /tmp/shots/03-timeline.png
          click 44 199; screencapture -x /tmp/shots/04-history.png
          click 300 130; screencapture -x /tmp/shots/04b-history-click1.png
          click 300 130; screencapture -x /tmp/shots/04c-history-click2.png
          click 44 73; screencapture -x /tmp/shots/02-captions.png
          click 44 241; screencapture -x /tmp/shots/05-about.png
          screencapture -x /tmp/shots/99-end.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: /tmp/shots
      - name: Commit shots back
        if: always()
        run: |
          mkdir -p .github/screenshots/out
          cp /tmp/shots/* .github/screenshots/out/ || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/screenshots/out
          git commit -m "mac screenshots output" || exit 0
          git pull --rebase origin ${{ github.head_ref }} || true
          git push origin HEAD:${{ github.head_ref }}
